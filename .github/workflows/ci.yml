name: YJ-64 Guard Validation

on:
  push:
    branches: ['main', 'work/chat-ui-remote-participant']
    paths:
      - 'PROTECTED-LINE-GUARD'
      - 'main.py'
      - 'chat_workspace.py'
      - 'yj64_persistent_core.py'
      - 'llm_api.py'
      - 'llm_settings.py'
      - 'message_distributor.py'
      - 'buildozer.spec'
      - '.github/workflows/ci.yml'
      - '.github/workflows/android-apk.yml'
      - 'tools/verify_guard.py'
      - 'remote_participant_server.py'
      - 'supervised_commercial_intelligence.py'
  pull_request:
    branches: ['main']
    paths:
      - 'PROTECTED-LINE-GUARD'
      - 'main.py'
      - 'llm_api.py'
      - 'llm_settings.py'
      - 'message_distributor.py'
      - 'buildozer.spec'
      - '.github/workflows/ci.yml'
      - '.github/workflows/android-apk.yml'
      - 'tools/verify_guard.py'
      - 'remote_participant_server.py'
      - 'supervised_commercial_intelligence.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: Verify Guard before any Android build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify protected fragments, APK version, and file identities
        run: |
          python3 tools/verify_guard.py
      - name: Compile protected Python modules
        run: |
          python3 -m py_compile main.py chat_workspace.py yj64_persistent_core.py remote_participant.py chatgpt_bridge.py llm_api.py llm_settings.py message_distributor.py remote_participant_server.py supervised_commercial_intelligence.py tools/verify_guard.py
